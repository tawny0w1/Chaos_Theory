<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaos Theory Simulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 10px;
            height: 100vh;
            width: 100%;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            width: 100%;
        }

        .controls-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            flex-wrap: wrap;
        }

        .checkbox-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .checkbox-container label {
            font-size: 11px;
            color: #666;
            cursor: pointer;
            margin: 0;
        }

        .checkbox-container input[type="checkbox"] {
            cursor: pointer;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .slider {
            width: 120px;
        }

        .slider-value {
            font-size: 12px;
            color: #666;
            font-weight: bold;
        }

        h1 {
            font-size: 24px;
            color: #333;
            margin: 5px 0;
        }

        .table-wrapper {
            flex: 1;
            width: 90vh;
            max-width: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .grid {
            width: 100%;
            aspect-ratio: 1;
            display: grid;
            gap: 0;
            background-color: white;
            padding: 5px;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .cell {
            border: 1px solid #d3d3d3;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.1s ease;
            position: relative;
        }

        .cell.black {
            background-color: black;
        }

        .cell.white {
            background-color: white;
        }

        .cell:hover {
            opacity: 0.8;
        }

        .predecessor-number {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: red;
            font-size: 10px;
            font-weight: bold;
            pointer-events: none;
            z-index: 1;
        }

        /* First row styling */
        .cell.first-row {
            cursor: pointer;
            background-color: #f0f0f0;
        }

        .cell.first-row:hover {
            background-color: #e0e0e0 !important;
        }

        /* Override for first row black cells */
        .cell.first-row.black {
            background-color: black !important;
        }

        /* Override for first row white cells */
        .cell.first-row.white {
            background-color: #f0f0f0 !important;
        }

        /* Other rows styling */
        .cell:not(.first-row) {
            cursor: default;
        }

        .button-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 8px 15px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:active {
            background-color: #003d82;
        }

        .info {
            color: #666;
            font-size: 14px;
            margin-top: 10px;
        }

        .info-inline {
            color: #666;
            font-size: 11px;
            margin: 0;
            align-self: center;
        }

        .settings-button-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .settings-panel {
            width: 100%;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 0;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease, margin 0.3s ease;
            margin: 0;
        }

        .settings-panel.open {
            max-height: 350px;
            padding: 15px;
            margin: 10px 0;
        }

        .settings-content {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .settings-controls {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }

        .small-tables-container {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 10px;
            width: 100%;
            margin-top: 10px;
        }

        .small-grid {
            width: 100%;
            aspect-ratio: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 0;
            background-color: white;
            border: 1px solid #d3d3d3;
            border-radius: 2px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        }

        .small-cell {
            border: 1px solid #d3d3d3;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.1s ease;
        }

        .small-cell.black {
            background-color: black;
        }

        .small-cell.white {
            background-color: white;
        }

        .small-cell:hover {
            opacity: 0.8;
        }

        .small-cell.non-clickable {
            cursor: default;
        }

        .small-cell.non-clickable:hover {
            opacity: 1;
        }

        /* Clickable cell styling (row 2, col 1) */
        .small-cell.clickable {
            background-color: #f0f0f0 !important;
            cursor: pointer;
        }

        .small-cell.clickable:hover {
            background-color: #e0e0e0 !important;
            opacity: 1;
        }

        .small-cell.clickable.black {
            background-color: black !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Chaos Theory Simulation - Rule 22</h1>
        
        <div class="controls">
            <div class="controls-row">
                <button id="generateBtn">Generate</button>
                <p class="info-inline">Click on cells in the first row to toggle them.</p>
                <div class="settings-button-container">
                    <button id="clearBtn">Clear</button>
                    <button id="settingsBtn">Settings</button>
                </div>
            </div>
            
            <div class="settings-panel" id="settingsPanel">
                <div class="settings-content">
                    <div class="settings-controls">
                        <div class="slider-container">
                            <label for="sizeSlider">Table Size</label>
                            <input type="range" id="sizeSlider" class="slider" min="3" max="100" value="9">
                            <div class="slider-value" id="sliderValue">9x9</div>
                        </div>
                        <button id="changeSizeBtn">Change Table Size</button>
                        <div class="checkbox-container">
                            <input type="checkbox" id="showPredecessors">
                            <label for="showPredecessors">Show Predecessors</label>
                        </div>
                    </div>
                    <div class="small-tables-container" id="smallTablesContainer"></div>
                </div>
            </div>
        </div>
        
        <div class="table-wrapper">
            <div class="grid" id="grid"></div>
        </div>
    </div>

    <script src="table.js"></script>
    <script>
        // Configuration
        let COLS = 9;
        let ROWS = 9;
        const STORAGE_KEY = 'grid_table_data';
        const SIZE_STORAGE_KEY = 'grid_table_size';
        const SMALL_TABLES_STORAGE_KEY = 'small_tables_data';

        let gridData = [];
        let smallTablesData = [];

        // Initialize grid from localStorage or create new
        function initializeGrid() {
            // Load table size from localStorage, default to 9
            const storedSize = localStorage.getItem(SIZE_STORAGE_KEY);
            if (storedSize) {
                const size = parseInt(storedSize);
                COLS = size;
                ROWS = size;
                // Update slider to match stored size
                document.getElementById('sizeSlider').value = size;
                document.getElementById('sliderValue').textContent = size + 'x' + size;
            }
            
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                gridData = JSON.parse(stored);
            } else {
                gridData = Table.create(ROWS, COLS);
            }

            // Initialize small tables data
            const storedSmallTables = localStorage.getItem(SMALL_TABLES_STORAGE_KEY);
            if (storedSmallTables) {
                smallTablesData = JSON.parse(storedSmallTables);
            } else {
                // Initialize with specified row 1 values (first row)
                const row1Values = [
                    [0, 0, 0],  // 000
                    [0, 1, 0],  // 010
                    [0, 0, 1],  // 001
                    [1, 1, 0],  // 110
                    [0, 1, 1],  // 011
                    [1, 0, 1],  // 101
                    [1, 1, 1],  // 111
                    [1, 0, 0]   // 100
                ];
                
                smallTablesData = [];
                for (let i = 0; i < 8; i++) {
                    const table = Table.create(2, 3);
                    // Set row 0 with specified values
                    for (let j = 0; j < 3; j++) {
                        table[0][j] = row1Values[i][j];
                    }
                    smallTablesData.push(table);
                }
            }

            renderGrid();
            renderSmallTables();
        }

        // Render small tables in settings panel
        function renderSmallTables() {
            const container = document.getElementById('smallTablesContainer');
            container.innerHTML = '';

            for (let tableIdx = 0; tableIdx < 8; tableIdx++) {
                const tableDiv = document.createElement('div');
                tableDiv.className = 'small-grid';
                tableDiv.dataset.tableIndex = tableIdx;

                for (let row = 0; row < 2; row++) {
                    for (let col = 0; col < 3; col++) {
                        const cell = document.createElement('div');
                        cell.className = 'small-cell';
                        
                        // Only row 1, column 1 is clickable
                        const isClickable = (row === 1 && col === 1);
                        if (isClickable) {
                            cell.classList.add('clickable');
                        } else {
                            cell.classList.add('non-clickable');
                        }
                        
                        const value = smallTablesData[tableIdx][row][col];
                        if (value === 1) {
                            cell.classList.add('black');
                        } else {
                            cell.classList.add('white');
                        }

                        cell.dataset.tableIndex = tableIdx;
                        cell.dataset.row = row;
                        cell.dataset.col = col;

                        if (isClickable) {
                            cell.addEventListener('click', handleSmallCellClick);
                        }
                        tableDiv.appendChild(cell);
                    }
                }

                container.appendChild(tableDiv);
            }
        }

        // Handle click on small table cells
        function handleSmallCellClick(event) {
            const tableIdx = parseInt(event.target.dataset.tableIndex);
            const row = parseInt(event.target.dataset.row);
            const col = parseInt(event.target.dataset.col);

            // Toggle the value
            smallTablesData[tableIdx][row][col] = smallTablesData[tableIdx][row][col] === 0 ? 1 : 0;

            // Save to localStorage
            saveSmallTablesData();

            // Update cell display
            updateSmallCell(tableIdx, row, col);
        }

        // Update a single small cell display
        function updateSmallCell(tableIdx, row, col) {
            const cell = document.querySelector(`[data-table-index="${tableIdx}"][data-row="${row}"][data-col="${col}"]`);
            if (cell) {
                cell.classList.remove('black', 'white');
                if (smallTablesData[tableIdx][row][col] === 1) {
                    cell.classList.add('black');
                } else {
                    cell.classList.add('white');
                }
            }
        }

        // Save small tables data to localStorage
        function saveSmallTablesData() {
            localStorage.setItem(SMALL_TABLES_STORAGE_KEY, JSON.stringify(smallTablesData));
        }

        // Render the grid on the page
        function renderGrid() {
            const grid = document.getElementById('grid');
            const showPredecessors = document.getElementById('showPredecessors').checked;
            
            grid.innerHTML = '';
            grid.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
            grid.style.gridTemplateRows = `repeat(${ROWS}, 1fr)`;

            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    if (row === 0) {
                        cell.classList.add('first-row');
                    }

                    const value = gridData[row][col];
                    if (value === 1) {
                        cell.classList.add('black');
                    } else {
                        cell.classList.add('white');
                    }

                    cell.dataset.row = row;
                    cell.dataset.col = col;

                    // Add predecessor number for rows >= 1 if checkbox is checked
                    if (showPredecessors && row >= 1) {
                        const predecessors = Table.getPredecessors(gridData, row, col);
                        const predecessorCount = predecessors.filter(p => p === 1).length;
                        
                        const numberDiv = document.createElement('div');
                        numberDiv.className = 'predecessor-number';
                        numberDiv.textContent = predecessorCount;
                        cell.appendChild(numberDiv);
                    }

                    // Only first row is clickable
                    if (row === 0) {
                        cell.addEventListener('click', handleCellClick);
                    }

                    grid.appendChild(cell);
                }
            }
        }

        // Handle click on first row
        function handleCellClick(event) {
            const row = parseInt(event.target.dataset.row);
            const col = parseInt(event.target.dataset.col);

            // Toggle the value
            gridData[row][col] = gridData[row][col] === 0 ? 1 : 0;

            // Save to localStorage
            saveGridData();

            // Update display
            updateCell(row, col);
        }

        // Update a single cell display
        function updateCell(row, col) {
            const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
            if (cell) {
                cell.classList.remove('black', 'white');
                if (gridData[row][col] === 1) {
                    cell.classList.add('black');
                } else {
                    cell.classList.add('white');
                }
                
                // Update predecessor number if showing and row >= 1
                const showPredecessors = document.getElementById('showPredecessors').checked;
                const existingNumber = cell.querySelector('.predecessor-number');
                
                if (showPredecessors && row >= 1) {
                    const predecessors = Table.getPredecessors(gridData, row, col);
                    const predecessorCount = predecessors.filter(p => p === 1).length;
                    
                    if (existingNumber) {
                        existingNumber.textContent = predecessorCount;
                    } else {
                        const numberDiv = document.createElement('div');
                        numberDiv.className = 'predecessor-number';
                        numberDiv.textContent = predecessorCount;
                        cell.appendChild(numberDiv);
                    }
                } else if (existingNumber) {
                    existingNumber.remove();
                }
            }
        }

        // Save grid data to localStorage
        function saveGridData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(gridData));
        }

        // Generate button - read entire table and update display
        document.getElementById('generateBtn').addEventListener('click', function() {
            // Run drawTable method to apply transformation algorithm
            Table.drawTable(gridData);
            
            // Save the modified table
            saveGridData();
            
            // Read entire table and fill in white and black fields for rows under first row
            for (let row = 1; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    updateCell(row, col);
                }
            }
        });

        // Settings button toggle
        document.getElementById('settingsBtn').addEventListener('click', function() {
            const settingsPanel = document.getElementById('settingsPanel');
            const settingsBtn = document.getElementById('settingsBtn');
            
            settingsPanel.classList.toggle('open');
            
            if (settingsPanel.classList.contains('open')) {
                settingsBtn.textContent = 'Hide Settings';
            } else {
                settingsBtn.textContent = 'Settings';
            }
        });
        /*   
        // Reset button - restore from localStorage
        document.getElementById('resetBtn').addEventListener('click', function() {
            localStorage.removeItem(STORAGE_KEY);
            gridData = Table.create(ROWS, COLS);
            renderGrid();
        });
        */

        // Clear button - set all to 0
        document.getElementById('clearBtn').addEventListener('click', function() {
            gridData = Table.create(ROWS, COLS);
            saveGridData();
            
            // Also clear small tables but preserve row 1 values
            const row1Values = [
                [0, 0, 0],  // 000
                [0, 1, 0],  // 010
                [0, 0, 1],  // 001
                [1, 1, 0],  // 110
                [0, 1, 1],  // 011
                [1, 0, 1],  // 101
                [1, 1, 1],  // 111
                [1, 0, 0]   // 100
            ];
            
            smallTablesData = [];
            for (let i = 0; i < 8; i++) {
                const table = Table.create(2, 3);
                // Set row 0 with specified values
                for (let j = 0; j < 3; j++) {
                    table[0][j] = row1Values[i][j];
                }
                smallTablesData.push(table);
            }
            saveSmallTablesData();
            
            renderGrid();
            renderSmallTables();
        });

        // Slider event listener
        document.getElementById('sizeSlider').addEventListener('input', function(event) {
            const size = parseInt(event.target.value);
            document.getElementById('sliderValue').textContent = size + 'x' + size;
        });

        // Show predecessors checkbox event listener
        document.getElementById('showPredecessors').addEventListener('change', function() {
            renderGrid();
        });

        // Change table size button
        document.getElementById('changeSizeBtn').addEventListener('click', function() {
            const newSize = parseInt(document.getElementById('sizeSlider').value);
            
            // Update dimensions
            COLS = newSize;
            ROWS = newSize;
            
            // Save table size to localStorage
            localStorage.setItem(SIZE_STORAGE_KEY, newSize.toString());
            
            // Clear localStorage for grid data
            localStorage.removeItem(STORAGE_KEY);
            
            // Create new grid data
            gridData = Table.create(ROWS, COLS);
            
            // Re-render the grid
            renderGrid();
        });

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', initializeGrid);
    </script>
</body>
</html>
