<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Table Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }

        .main-content {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            min-width: 150px;
        }

        .checkbox-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .checkbox-container label {
            font-size: 12px;
            color: #666;
            cursor: pointer;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .slider {
            width: 120px;
        }

        .slider-value {
            font-size: 14px;
            color: #666;
            font-weight: bold;
        }

        h1 {
            font-size: 24px;
            color: #333;
        }

        .table-wrapper {
            width: 50vw;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .grid {
            width: 100%;
            height: 100%;
            display: grid;
            gap: 0;
            background-color: white;
            padding: 10px;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .cell {
            border: 1px solid #d3d3d3;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.1s ease;
            position: relative;
        }

        .cell.black {
            background-color: black;
        }

        .cell.white {
            background-color: white;
        }

        .cell:hover {
            opacity: 0.8;
        }

        .predecessor-number {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: red;
            font-size: 10px;
            font-weight: bold;
            pointer-events: none;
            z-index: 1;
        }

        /* First row styling */
        .cell.first-row {
            cursor: pointer;
            background-color: #f0f0f0;
        }

        .cell.first-row:hover {
            background-color: #e0e0e0 !important;
        }

        /* Override for first row black cells */
        .cell.first-row.black {
            background-color: black !important;
        }

        /* Override for first row white cells */
        .cell.first-row.white {
            background-color: #f0f0f0 !important;
        }

        /* Other rows styling */
        .cell:not(.first-row) {
            cursor: default;
        }

        .button-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:active {
            background-color: #003d82;
        }

        .info {
            color: #666;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Chaos Theory Simulation</h1>
        
        <div class="main-content">
            <div class="controls">
                <div class="slider-container">
                    <label for="sizeSlider">Table Size</label>
                    <input type="range" id="sizeSlider" class="slider" min="3" max="100" value="9">
                    <div class="slider-value" id="sliderValue">9x9</div>
                </div>
                <button id="changeSizeBtn">Change Table Size</button>
                <div class="checkbox-container">
                    <label for="showPredecessors">Show Predecessors</label>
                    <input type="checkbox" id="showPredecessors">
                </div>
            </div>
            
            <div class="table-wrapper">
                <div class="grid" id="grid"></div>
            </div>
        </div>

        <div class="button-container">
            <button id="generateBtn">Generate</button>
            <button id="clearBtn">Clear</button>
        </div>

        <div class="info">
            <p>Click on cells in the first row to toggle them.</p>
        </div>
    </div>

    <script src="table.js"></script>
    <script>
        // Configuration
        let COLS = 9;
        let ROWS = 9;
        const STORAGE_KEY = 'grid_table_data';
        const SIZE_STORAGE_KEY = 'grid_table_size';

        let gridData = [];

        // Initialize grid from localStorage or create new
        function initializeGrid() {
            // Load table size from localStorage, default to 9
            const storedSize = localStorage.getItem(SIZE_STORAGE_KEY);
            if (storedSize) {
                const size = parseInt(storedSize);
                COLS = size;
                ROWS = size;
                // Update slider to match stored size
                document.getElementById('sizeSlider').value = size;
                document.getElementById('sliderValue').textContent = size + 'x' + size;
            }
            
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                gridData = JSON.parse(stored);
            } else {
                gridData = Table.create(ROWS, COLS);
            }
            renderGrid();
        }

        // Render the grid on the page
        function renderGrid() {
            const grid = document.getElementById('grid');
            const showPredecessors = document.getElementById('showPredecessors').checked;
            
            grid.innerHTML = '';
            grid.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
            grid.style.gridTemplateRows = `repeat(${ROWS}, 1fr)`;

            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    if (row === 0) {
                        cell.classList.add('first-row');
                    }

                    const value = gridData[row][col];
                    if (value === 1) {
                        cell.classList.add('black');
                    } else {
                        cell.classList.add('white');
                    }

                    cell.dataset.row = row;
                    cell.dataset.col = col;

                    // Add predecessor number for rows >= 1 if checkbox is checked
                    if (showPredecessors && row >= 1) {
                        const predecessors = Table.getPredecessors(gridData, row, col);
                        const predecessorCount = predecessors.filter(p => p === 1).length;
                        
                        const numberDiv = document.createElement('div');
                        numberDiv.className = 'predecessor-number';
                        numberDiv.textContent = predecessorCount;
                        cell.appendChild(numberDiv);
                    }

                    // Only first row is clickable
                    if (row === 0) {
                        cell.addEventListener('click', handleCellClick);
                    }

                    grid.appendChild(cell);
                }
            }
        }

        // Handle click on first row
        function handleCellClick(event) {
            const row = parseInt(event.target.dataset.row);
            const col = parseInt(event.target.dataset.col);

            // Toggle the value
            gridData[row][col] = gridData[row][col] === 0 ? 1 : 0;

            // Save to localStorage
            saveGridData();

            // Update display
            updateCell(row, col);
        }

        // Update a single cell display
        function updateCell(row, col) {
            const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
            if (cell) {
                cell.classList.remove('black', 'white');
                if (gridData[row][col] === 1) {
                    cell.classList.add('black');
                } else {
                    cell.classList.add('white');
                }
                
                // Update predecessor number if showing and row >= 1
                const showPredecessors = document.getElementById('showPredecessors').checked;
                const existingNumber = cell.querySelector('.predecessor-number');
                
                if (showPredecessors && row >= 1) {
                    const predecessors = Table.getPredecessors(gridData, row, col);
                    const predecessorCount = predecessors.filter(p => p === 1).length;
                    
                    if (existingNumber) {
                        existingNumber.textContent = predecessorCount;
                    } else {
                        const numberDiv = document.createElement('div');
                        numberDiv.className = 'predecessor-number';
                        numberDiv.textContent = predecessorCount;
                        cell.appendChild(numberDiv);
                    }
                } else if (existingNumber) {
                    existingNumber.remove();
                }
            }
        }

        // Save grid data to localStorage
        function saveGridData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(gridData));
        }

        // Generate button - read entire table and update display
        document.getElementById('generateBtn').addEventListener('click', function() {
            // Run drawTable method to apply transformation algorithm
            Table.drawTable(gridData);
            
            // Save the modified table
            saveGridData();
            
            // Read entire table and fill in white and black fields for rows under first row
            for (let row = 1; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    updateCell(row, col);
                }
            }
        });
        /*   
        // Reset button - restore from localStorage
        document.getElementById('resetBtn').addEventListener('click', function() {
            localStorage.removeItem(STORAGE_KEY);
            gridData = Table.create(ROWS, COLS);
            renderGrid();
        });
        */

        // Clear button - set all to 0
        document.getElementById('clearBtn').addEventListener('click', function() {
            gridData = Table.create(ROWS, COLS);
            saveGridData();
            renderGrid();
        });

        // Slider event listener
        document.getElementById('sizeSlider').addEventListener('input', function(event) {
            const size = parseInt(event.target.value);
            document.getElementById('sliderValue').textContent = size + 'x' + size;
        });

        // Show predecessors checkbox event listener
        document.getElementById('showPredecessors').addEventListener('change', function() {
            renderGrid();
        });

        // Change table size button
        document.getElementById('changeSizeBtn').addEventListener('click', function() {
            const newSize = parseInt(document.getElementById('sizeSlider').value);
            
            // Update dimensions
            COLS = newSize;
            ROWS = newSize;
            
            // Save table size to localStorage
            localStorage.setItem(SIZE_STORAGE_KEY, newSize.toString());
            
            // Clear localStorage for grid data
            localStorage.removeItem(STORAGE_KEY);
            
            // Create new grid data
            gridData = Table.create(ROWS, COLS);
            
            // Re-render the grid
            renderGrid();
        });

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', initializeGrid);
    </script>
</body>
</html>
